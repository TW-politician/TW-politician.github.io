function uniqueSorted(key) {
  return [...new Set(PEOPLE.map(p => p[key]).filter(Boolean))].sort();
}

function fillSelect(id, values) {
  const el = document.getElementById(id);
  for (const v of values) {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    el.appendChild(opt);
  }
}

function render() {
  const level = document.getElementById('f-level').value;
  const party = document.getElementById('f-party').value;
  const county = document.getElementById('f-county').value;
  const district = document.getElementById('f-district').value;

  const filtered = PEOPLE.filter(p =>
    (!level || p.level === level) &&
    (!party || p.party === party) &&
    (!county || p.county === county) &&
    (!district || p.district_type === district)
  );

  const body = document.getElementById('directory-body');
  body.innerHTML = '';
  for (const p of filtered) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><a href="../people/${p.slug}/">${p.name}</a></td><td>${p.level}</td><td>${p.party}</td><td>${p.county}</td><td>${p.district_type}</td>`;
    body.appendChild(tr);
  }
}

fillSelect('f-level', uniqueSorted('level'));
fillSelect('f-party', uniqueSorted('party'));
fillSelect('f-county', uniqueSorted('county'));
fillSelect('f-district', uniqueSorted('district_type'));

for (const id of ['f-level', 'f-party', 'f-county', 'f-district']) {
  document.getElementById(id).addEventListener('change', render);
}

render();
